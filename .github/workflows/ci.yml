name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A new push to a branch or pull request cancels the run it replaces; tags each keep their own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  static:
    name: Lint, analyse, gates, unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint
      - run: composer analyse
      - run: composer gates
      - run: composer test:coverage
      - name: Coverage floors (100 % of src/Domain, 90 % overall)
        run: php tools/coverage-floor.php tmp/coverage.xml

  js:
    name: JavaScript and CSS standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer infection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-logs
          path: tmp/infection*.log

  benchmarks:
    name: Benchmarks (the budgets are tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer test:benchmark

  integration:
    name: Integration, Plugin Check, browser (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The spec's matrix (Compatibility; D-011, D-083): both ends of WordPress and WooCommerce, MySQL 8.0 and
        # MariaDB 10.6 beside wp-env's own MariaDB, HPOS off (WooCommerce's default is on), a persistent object cache.
        leg: ['newest', 'oldest', 'mysql80', 'mariadb106', 'hpos-off', 'object-cache']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pin the oldest supported WordPress, WooCommerce and PHP
        if: matrix.leg == 'oldest'
        run: npm run env:oldest
      - run: npx wp-env start
      - name: The i18n check (the POT current, the fr_CA translation complete)
        if: matrix.leg == 'newest'
        run: composer i18n:check
      - name: A database server for the leg
        if: matrix.leg == 'mysql80' || matrix.leg == 'mariadb106'
        run: tools/matrix-db.sh ${{ matrix.leg == 'mysql80' && 'mysql:8.0' || 'mariadb:10.6' }} csearch-${{ matrix.leg }}
      - run: composer test:integration
        env:
          CSEARCH_DB_HOST: ${{ (matrix.leg == 'mysql80' || matrix.leg == 'mariadb106') && format('csearch-{0}', matrix.leg) || '' }}
          CSEARCH_HPOS: ${{ matrix.leg == 'hpos-off' && 'off' || '' }}
          CSEARCH_OBJECT_CACHE: ${{ matrix.leg == 'object-cache' && 'persistent' || '' }}
      - name: The benchmark group (query plans and the 300-product budgets)
        if: matrix.leg == 'newest' || matrix.leg == 'mysql80'
        run: composer test:integration -- --group benchmark
        env:
          CSEARCH_DB_HOST: ${{ matrix.leg == 'mysql80' && 'csearch-mysql80' || '' }}
      # The browser site runs on wp-env's own database, so the browser tests and Plugin Check run on the two
      # version legs only; the database, HPOS and cache legs are integration legs.
      - run: npm run plugin-check
        if: matrix.leg == 'newest' || matrix.leg == 'oldest'
      - run: npx playwright install --with-deps
        if: matrix.leg == 'newest' || matrix.leg == 'oldest'
      - run: npm run test:e2e
        if: matrix.leg == 'newest' || matrix.leg == 'oldest'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.leg }}
          path: test-results

  index-budgets:
    name: Index and API budgets at 10,000 products
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wp-env start
      - run: composer install --working-dir=tools/integration --no-interaction
      # Most of this step is loading the catalogue through WooCommerce, quietly (term counts deferred, the plugin's index
      # hooks detached: about 63 ms a product locally, flat as it grows); each phase's time is in the log.
      - name: Load 10,000 products, then the full reindex (5-minute budget) and the golden set through the API (p95 budgets)
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/creative-search -- env CSEARCH_BENCH_PRODUCTS=10000 php -d memory_limit=4G tools/integration/vendor/bin/phpunit -c phpunit-integration.xml.dist --group benchmark
