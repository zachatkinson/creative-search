name: CI

# A change to the docs alone runs nothing (D-148). A version tag runs nothing either: release.yml publishes once this
# workflow has passed on the tagged commit's push to main (D-140, D-148).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE']

# A new push to a pull request cancels the run it replaces; each push to main keeps its own run, which a release
# waits for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request needs (D-152): one that touches only the browser tests or the workflows (and the docs) runs the standards, the
  # unit tests and the newest leg (its integration tests, Plugin Check and every browser project), not the other legs,
  # mutation testing or the budgets. Main always runs everything; a release waits for that run.
  scope:
    name: What this change runs
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      legs: ${{ steps.scope.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          full=true
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            others=$(git diff --name-only "origin/${BASE}...HEAD" | grep -Ev '^(tests/e2e/|\.github/workflows/|docs/|LICENSE$)|\.md$' || true)
            if [ -z "$others" ]; then
              full=false
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then
            echo 'legs=["newest","oldest","mysql80","mariadb106","hpos-off","object-cache"]' >> "$GITHUB_OUTPUT"
          else
            echo 'legs=["newest"]' >> "$GITHUB_OUTPUT"
          fi
          echo "Full run: $full"

  static:
    name: Lint, analyse, gates, unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint
      - run: composer analyse
      - run: composer gates
      - run: composer test:coverage
      - name: Coverage floors (100 % of src/Domain, 90 % overall)
        run: php tools/coverage-floor.php tmp/coverage.xml

  js:
    name: JavaScript and CSS standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  mutation:
    name: Mutation testing (Infection)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request mutates the lines it changes, against its base branch (D-148). Quoted: a bare 0 is falsy in
          # an expression, so `&& 0 || 1` was always 1 and the base branch never fetched.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      # The same two configurations and floors either way (90 % outside the Domain, 100 % inside it); a pull request
      # applies them to its changed lines, and passes when it changed none they mutate. Main runs everything.
      - name: Infection (a pull request's changed lines; everything on main)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            diff=(--git-diff-lines "--git-diff-base=origin/${BASE}" --ignore-msi-with-no-mutations)
            vendor/bin/infection --threads=max --configuration=infection.json5 "${diff[@]}"
            vendor/bin/infection --threads=max --configuration=infection-domain.json5 "${diff[@]}"
          else
            composer infection
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-logs
          path: tmp/infection*.log

  benchmarks:
    name: Benchmarks (the budgets are tests)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer test:benchmark

  integration:
    name: Integration, Plugin Check, browser (${{ matrix.leg }})
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The spec's matrix (Compatibility; D-011, D-083): both ends of WordPress and WooCommerce, MySQL 8.0 and
        # MariaDB 10.6 beside wp-env's own MariaDB, HPOS off (WooCommerce's default is on), a persistent object cache.
        # Newest alone for a pull request that touches only the browser tests or the workflows (D-152).
        leg: ${{ fromJSON(needs.scope.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pin the oldest supported WordPress, WooCommerce and PHP
        if: matrix.leg == 'oldest'
        run: npm run env:oldest
      - run: npx wp-env start
      - name: The i18n check (the POT current, the fr_CA translation complete)
        if: matrix.leg == 'newest'
        run: composer i18n:check
      - name: A database server for the leg
        if: matrix.leg == 'mysql80' || matrix.leg == 'mariadb106'
        run: tools/matrix-db.sh ${{ matrix.leg == 'mysql80' && 'mysql:8.0' || 'mariadb:10.6' }} csearch-${{ matrix.leg }}
      - run: composer test:integration
        env:
          CSEARCH_DB_HOST: ${{ (matrix.leg == 'mysql80' || matrix.leg == 'mariadb106') && format('csearch-{0}', matrix.leg) || '' }}
          CSEARCH_HPOS: ${{ matrix.leg == 'hpos-off' && 'off' || '' }}
          CSEARCH_OBJECT_CACHE: ${{ matrix.leg == 'object-cache' && 'persistent' || '' }}
      - name: The benchmark group (query plans and the 300-product budgets)
        if: matrix.leg == 'newest' || matrix.leg == 'mysql80'
        run: composer test:integration -- --group benchmark
        env:
          CSEARCH_DB_HOST: ${{ matrix.leg == 'mysql80' && 'csearch-mysql80' || '' }}
      # The browser site runs on wp-env's own database, so the browser tests and Plugin Check run on the two
      # version legs only; the database, HPOS and cache legs are integration legs.
      - run: npm run plugin-check
        if: matrix.leg == 'newest' || matrix.leg == 'oldest'
      # Newest runs every browser project; oldest, which is there for the WordPress and WooCommerce versions, one
      # desktop and one phone engine (D-148). The browsers are cached by Playwright's version; the system packages
      # they need are installed each time.
      - name: The browser projects for the leg
        id: browsers
        if: matrix.leg == 'newest' || matrix.leg == 'oldest'
        run: |
          if [ "${{ matrix.leg }}" = newest ]; then
            echo "engines=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
          else
            echo "engines=chromium webkit" >> "$GITHUB_OUTPUT"
            echo "projects=--project=chromium-desktop --project=webkit-phone" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        if: matrix.leg == 'newest' || matrix.leg == 'oldest'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browsers.outputs.version }}-${{ matrix.leg }}
      - run: npx playwright install --with-deps ${{ steps.browsers.outputs.engines }}
        if: (matrix.leg == 'newest' || matrix.leg == 'oldest') && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps ${{ steps.browsers.outputs.engines }}
        if: (matrix.leg == 'newest' || matrix.leg == 'oldest') && steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e -- ${{ steps.browsers.outputs.projects }}
        if: matrix.leg == 'newest' || matrix.leg == 'oldest'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.leg }}
          path: test-results

  index-budgets:
    name: Index and API budgets at 10,000 products
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wp-env start
      - run: composer install --working-dir=tools/integration --no-interaction
      # The catalogue as loaded, kept between runs while the catalogue, its loader, and the WordPress and WooCommerce
      # versions stay the same (D-148): a hit skips the load, never the reindex or the budgets.
      - uses: actions/cache@v4
        with:
          path: tmp/catalogue-10000.json.gz
          key: catalogue-10000-${{ hashFiles('tests/Fixtures/Catalogue.php', 'tests/Support/WooCommerceCatalogue.php', 'tests/Support/CatalogueSnapshot.php', '.wp-env.json') }}
      # Without the cached catalogue, most of this step is loading it through WooCommerce, quietly (term counts deferred,
      # the plugin's index hooks detached: about 63 ms a product locally, 42 minutes on a runner), and the dump is then
      # written for the next run; each phase's time is in the log.
      - name: Load 10,000 products, then the full reindex (5-minute budget) and the golden set through the API (p95 budgets)
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/creative-search -- env CSEARCH_BENCH_PRODUCTS=10000 CSEARCH_BENCH_SNAPSHOT=tmp/catalogue-10000.json.gz php -d memory_limit=4G tools/integration/vendor/bin/phpunit -c phpunit-integration.xml.dist --group benchmark
